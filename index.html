<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diários Endo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M9 8h9a6 6 0 0 1 0 12h-4v4H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --fundo: #f4f5f7; --cartao: #fff; --texto: #1d2129; --suave: #5f6673; --linha: #dde1e7; --acento: #1f6feb; --ok: #1a7f37; --erro: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #0f1115; --cartao: #181b21; --texto: #e6e8eb; --suave: #9aa1ab; --linha: #2a2f37; --acento: #4c8dff; --ok: #3fb950; --erro: #f85149; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fundo); color: var(--texto); }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--suave); font-size: 14px; }
  a.pc { display: block; text-decoration: none; color: inherit; background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  a.pc:hover, a.pc:focus-visible { border-color: var(--acento); outline: none; }
  .topo { display: flex; align-items: center; gap: 10px; }
  .nome { font-weight: 600; font-size: 18px; }
  .papel { color: var(--suave); font-size: 14px; margin-top: 2px; }
  .estado { margin-left: auto; font-size: 13px; color: var(--suave); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--linha); }
  .on .ponto { background: var(--ok); } .on .estado { color: var(--ok); }
  .off .ponto { background: var(--erro); } .off .estado { color: var(--erro); }
  form { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  form input { font: inherit; font-size: 22px; letter-spacing: 8px; width: 9ch; padding: 6px 4px 6px 12px; border: 1px solid var(--linha); border-radius: 8px; background: var(--fundo); color: var(--texto); text-align: center; }
  form button { font: inherit; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--acento); color: #fff; cursor: pointer; }
  #erro { color: var(--erro); font-size: 14px; width: 100%; min-height: 1.5em; margin: 0; }
  footer { color: var(--suave); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Diários Endo</h1>
  <form id="porta">
    <label for="pin">Código</label>
    <input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required autofocus>
    <button>Abrir</button>
    <p id="erro"></p>
  </form>
  <div id="lista" hidden></div>
  <footer id="nota" hidden>O estado dos Diários vê-se pelo ícone de cada site; esta página não lê nada dos servidores. «Não confirmado» num Chrome ou Edge com a Tailscale ligada não quer dizer desligado: o atalho abre na mesma.</footer>
</main>
<script>
  // Os atalhos vão cifrados; o código de 4 dígitos dá a chave (PBKDF2 + AES-GCM, tudo neste browser).
  const COFRE = {"sal":"Y6dmLZn7vj2pYWXsuyrEDA==","iv":"aDHnwT+Hbexrsjl3","it":1000000,"dados":"n40xTudu5l5DySKRMnOi9LCPnFHv66owynSuCHSsW0dLroqHuGXHFSF7C3f6rwDxTYWwl7b4AOeKurlTYaG2JxA66bnZ/Zsxy1CQa5fcuvi0R7v1lQ1DmwSC8pSduQFrDosWJJ8FPKwi0UPDaK4+9nIb1mmU2QdxdxvfAcUPIH6UkPh8u/zbiS+jnZrYq8lQQTOso28khs048RPoBNeNf9ejpwBzSeDP81Nmnu6yWfIm2VqmKD2rJnSSMENh3qlDFM51r8yB7m5EPGZUtA5XfpC8vS6HmNsuROrmX4NtAuxmDuKl+dwBicVdNnUFHFK7CMyJJrhOPTz77edBtwdRECiDpKZnwmvcRsDDfvT+cDz3F2EBmSUGTOO9tPO2B5ID4xawKhFjRxkO99FiDLeZ7VmxDoxIcBUmSYssReyK/bf09GRJ1iUQBNnL2gXWKhj06gZ5fr2a4rR57cYUl8HsA4TTjIjCui8NfB9GKlTogrKWDQxajm1wzc9KQlXCxCPcySBDTmy9DRwHwyCsTtUBgP7OOgveofFEGtGUc0lcIAw+J5GzCRlwNCpkFW3ulqDoeYal8iel1+B52RKcD6BGcsw31QHa2+Kniu2c2vmBPPbwIeSgMiNM1Z42lp0unY2CzWC3AXbmOZjyMqcep4V2c7zvXPqrnBwS6cNXeOyoMts2zBEjB6/K3EIWmwvzpcudeSvDmy7Zv8M1kC5ac8pME6cnBdZsTW9aiLprKXnjVASq7avwWK9ZvZ2mNUTfSKvF8axdTK9CVuWSNppGR7AI1XFi7ExdLk1mZL9pGn3yCQm/t6rDETKtC2VeJ0wo+CYCy2pLEoI0VNE8BW5loF+ppIM730vPwtb0Z4a760jkU6NYl4a6hTnLzUyiZ77ppsuRET/LgkeEsHcIClmeiFDIoU16yhxF4QjtuUzms9BqFhihT+k3ss8qk7AiAQCpF/86eVH5OMHAsI/uTQ8yLBUyRmSHflzibcoap2z6XqvJQguVLbLMimigbm3ZjJJjomRgWUNyWT0bmsAUAau6shCUXWMoL3/EOoQMkiFxWMA="};
  const de64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function abrir(pin) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: de64(COFRE.sal), iterations: COFRE.it, hash: "SHA-256" },
                                                base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const t = await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(COFRE.iv) }, chave, de64(COFRE.dados));
    return JSON.parse(new TextDecoder().decode(t));
  }

  function mostrar(atalhos) {
    const lista = document.getElementById("lista");
    for (const a of atalhos) {
      const el = document.createElement("a");
      el.className = "pc"; el.id = a.id; el.href = a.url;
      const topo = document.createElement("div"); topo.className = "topo";
      const nome = document.createElement("span"); nome.className = "nome"; nome.textContent = a.nome;
      topo.append(nome);
      if (a.estado) {
        const e = document.createElement("span"); e.className = "estado";
        e.innerHTML = '<span class="ponto"></span><span class="txt">a verificar…</span>';
        topo.append(e);
      }
      const papel = document.createElement("div"); papel.className = "papel"; papel.textContent = a.papel;
      el.append(topo, papel);
      lista.append(el);
      if (a.estado) verificar(el);
    }
    document.getElementById("porta").hidden = true;
    lista.hidden = false;
    document.getElementById("nota").hidden = false;
  }

  // Um servidor dos Diários está ligado se o ícone público do site carregar (pedido de imagem; sem sessão nem dados).
  function verificar(el) {
    const img = new Image();
    const marcar = (on) => {
      el.classList.toggle('on', on); el.classList.toggle('off', !on);
      el.querySelector('.txt').textContent = on ? 'ligado' : 'não confirmado';
      el.title = on ? '' : 'Sem confirmação: o servidor pode estar desligado, ou este browser (Chrome/Edge com a Tailscale ligada) não deixa verificar. O atalho abre na mesma.';
    };
    const t = setTimeout(() => marcar(false), 8000);
    img.onload = () => { clearTimeout(t); marcar(true); };
    img.onerror = () => { clearTimeout(t); marcar(false); };
    img.src = new URL('icon.svg', el.href).href + '?t=' + Date.now();
  }

  document.getElementById("porta").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pin = document.getElementById("pin").value.trim();
    const erro = document.getElementById("erro");
    erro.textContent = "A abrir…";
    try {
      mostrar(await abrir(pin));
      try { sessionStorage.setItem("pin", pin); } catch (e) { /* sem armazenamento */ }
    } catch (e) {
      erro.textContent = "Código errado.";
      document.getElementById("pin").select();
    }
  });

  // no mesmo separador não volta a pedir
  let guardado = null;
  try { guardado = sessionStorage.getItem("pin"); } catch (e) { /* sem armazenamento */ }
  if (guardado) abrir(guardado).then(mostrar, () => {});
</script>
</body>
</html>
